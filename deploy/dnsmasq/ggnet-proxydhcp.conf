# ggNet proxyDHCP: the router keeps handing out IP addresses; this only answers
# PXE requests and serves iPXE over TFTP. Only one PXE server may run in the LAN.
# Adjust interface and dhcp-range to the service network.

port=0
interface=vmbr1
bind-interfaces
dhcp-range=192.168.0.0,proxy,255.255.255.0
log-dhcp

enable-tftp
tftp-root=/var/lib/ggnet/tftp

# UEFI x64 clients (client-arch 7 and 9). The iPXE binary has its script
# embedded (deploy/ipxe/embed.ipxe), so there is no PXE → iPXE loop.
pxe-service=X86-64_EFI,"ggNet",ggnet-ipxe.efi
pxe-service=BC_EFI,"ggNet",ggnet-ipxe.efi
