name: Release

# Runs when you push a tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the VERSION file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($file)"; exit 1
          fi

      - uses: actions/setup-node@v5
        if: ${{ hashFiles('frontend/package.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: npm ci && npm run build

      - name: Package ggnet.tar.gz
        run: |
          mkdir -p dist/ggnet
          cp -a backend scripts VERSION LICENSE README.md dist/ggnet/
          rm -rf dist/ggnet/backend/tests
          if [ -d frontend/dist ]; then
            mkdir -p dist/ggnet/frontend
            cp -a frontend/dist dist/ggnet/frontend/dist
          fi
          tar -czf ggnet.tar.gz -C dist ggnet

      - uses: softprops/action-gh-release@v3
        with:
          files: ggnet.tar.gz
          generate_release_notes: true
